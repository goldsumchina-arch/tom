# ============================================================
# AGI-PM 云端后端配置
# 这个文件告诉 Cloudflare：项目叫什么、入口文件在哪、要连接哪些服务
# ============================================================

name = "agi-gs"
main = "src/index.js"
compatibility_date = "2026-08-30"

# ---- 前端静态页面托管 ----
# pages.dev 域名在部分网络（如越南运营商）被封锁，无法访问；
# 改由 Worker 同域托管前端页面：https://agi-gs.tomalso911.workers.dev/
# 静态文件命中直接返回；/api/* 继续走 Worker 代码（同源，无需跨域）。
[assets]
directory = "./pages/dist"

# ---- 培训模式开关 ----
# AUTO_CLEAR_ON_LOGIN = "1"：每次登录成功自动清空业务数据（CRM/WON/LOST/审批单），
#   登录进来就是空场，点 DEMO 才出现演示数据；用户名录不受影响。
#
# ★ 已关闭（改为 "0"）：该开关会【删除真实业务数据】——任何用户登录一次就把
#   CRM/WON/LOST/审批单全部清空，再点 DEMO 灌入演示数据，导致真实数据永久丢失。
#   培训演示请用 DEMO 按钮（看板标题右侧）手动加载/清空，不要靠登录自动清场。
[vars]
AUTO_CLEAR_ON_LOGIN = "0"

# ---- 私密空间（Vault，tom 专属）----
# 4 位 PIN，输错 5 次锁 60 秒；改完后 `wrangler deploy` 即生效
VAULT_PIN = "1116"

# ---- 维护锁（暗门）----
# 只放行名单内的人登录，多人用逗号分隔，例如 "tom,admin"
# 留空（""）= 解除限制，用户名录内所有人恢复登录
# 需要临时锁定时改成 "tom" 再 wrangler deploy 即可
LOGIN_ONLY_USERS = ""

# ---- D1 用量统计（长按头像 3 秒查看）----
# 走 Cloudflare 官方分析 API（不消耗 D1 额度），需要账号 ID + 数据库 ID。
# ★ 令牌本身用 secret 存，不写进配置文件：
#     cd cloudflare && npx wrangler secret put CF_ANALYTICS_TOKEN
#   权限：Account → Account Analytics → Read
CF_ACCOUNT_ID = "3dd7bef80dfcb458db4f28ed47710b12"
CF_D1_DATABASE_ID = "18bdfdb9-dd45-4235-bba1-065547355541"

# D1 免费套餐每日行读上限（Workers Free = 500 万/天）；升级套餐后可改大
D1_DAILY_READ_LIMIT = "5000000"

# 开启日志：让你能在 Cloudflare 后台看到每一次请求，排错时非常有用
[observability]
enabled = true

# ------------------------------------------------------------
# R2 文件柜（就是你在 Cloudflare 后台建的 agi-pm-files）
# binding = "FILES" 意思是：代码里用 env.FILES 就能操作这个柜子
# ------------------------------------------------------------
[[r2_buckets]]
binding = "FILES"
bucket_name = "agi-pm-files"

# ------------------------------------------------------------
# D1 数据库（M2 已接入）
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "agi-pm-db"
database_id = "18bdfdb9-dd45-4235-bba1-065547355541"

# ------------------------------------------------------------
# Workers AI（翻译兜底主后端）：@cf/meta/m2m100-1.2b 多语翻译模型
# 在 Cloudflare 网络内运行，不受 Google 对 Cloudflare 出口 IP 的封锁影响，
# 也无 MyMemory 共享 IP 配额 / Libre 公共实例 530 问题。
# ------------------------------------------------------------
[ai]
binding = "AI"
