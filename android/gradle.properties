# ============================================================
# Gradle 全局配置
# ============================================================

# JVM 内存：给 Gradle 分配 2GB，避免大项目编译时内存不足
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# AndroidX（新版 Android 支持库，必须开启）
android.useAndroidX=true

# 自动迁移第三方库到 AndroidX
android.enableJetifier=true

# 非传递性 R 类：加快编译速度
android.nonTransitiveRClass=true

# ============================================================
# 发布签名配置（release APK 用，自签名 keystore）
# 注意：此文件含签名密码，请勿提交到公开仓库
# ============================================================
AGI_PM_RELEASE_STORE_FILE=agi-pm-release.keystore
AGI_PM_RELEASE_KEY_ALIAS=agipm
AGI_PM_RELEASE_STORE_PASSWORD=AgipmRelease2026!
AGI_PM_RELEASE_KEY_PASSWORD=AgipmRelease2026!
