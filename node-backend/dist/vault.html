<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:#0f1722; color:#e7edf3; }

  /* PIN 弹窗 */
  .vault-pin-modal { position:fixed; inset:0; background:rgba(10,18,28,.92); display:flex; align-items:center; justify-content:center; z-index:9000; }

  /* 主面板 */
  .vault-overlay { position:fixed; inset:0; display:flex; flex-direction:column; z-index:8800; }

  .vault-head { display:flex; align-items:center; gap:6px; padding:4px 10px; background:#16202c; border-bottom:1px solid #243140; min-height:32px; line-height:1; }
  .vault-head-back, .vault-close, .vault-orient-btn,

  .vault-title { font-size:13px; font-weight:700; display:flex; align-items:center; gap:4px; }

  .vault-ver-info:hover .vault-head-ver { display:inline; }
  .vault-ver-info .vault-head-ver { display:inline; }
  .vault-close { margin-left:auto; background:#e74c3c; color:#fff; border:none; cursor:pointer; font-weight:600; }
  .vault-close:hover { background:#c0392b; }

  .vault-stat { font-size:11px; color:#7a8a99; }
  .vault-list { flex:1; overflow:auto; padding:6px 10px 10px; }
  .vault-crumbs { padding:3px 10px 0; font-size:11px; color:#9fb0bd; min-height:18px; }
  .vault-empty { padding:30px 10px; color:#7a8a99; font-size:12px; text-align:center; }
  .vault-item { display:flex; align-items:center; gap:10px; padding:14px 16px; margin-bottom:10px; background:#16202c; border:1px solid #243140; border-radius:10px; cursor:pointer; }

  .vault-item-name { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vault-item-meta { font-size:12px; color:#7a8a99; min-width:170px; }
  .vault-item-actions { display:flex; gap:10px; align-items:center; }
  .vault-item-actions button, .vault-item-actions .vault-dl { background:#22303f; color:#cfe0ee; border:1px solid #34465a; padding:7px 14px; border-radius:7px; cursor:pointer; font-size:13px; text-decoration:none; }
  .vault-item-actions button:hover, .vault-item-actions .vault-dl:hover { background:#2c3d4f; }
  .vault-empty { padding:60px 22px; text-align:center; color:#7a8a99; }
  .vault-preview { position:fixed; inset:0; z-index:9500; background:rgba(8,14,22,.96); display:flex; flex-direction:column; }
  .vault-preview-head { display:flex; align-items:center; gap:14px; padding:12px 20px; background:#16202c; border-bottom:1px solid #243140; font-size:14px; color:#e7edf3; }
  .vault-preview-head button { margin-left:auto; background:#e74c3c; color:#fff; border:none; width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:16px; }
  .vault-preview-body { flex:1; overflow:auto; padding:16px; }
  .vault-loading { color:#9fb0bd; text-align:center; margin-top:40px; }
  /* 面包屑 / 文件夹 */
  .vault-crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:10px 22px 0; font-size:13px; color:#9fb0bd; }
  .vault-crumbs a { color:#6db3f2; cursor:pointer; text-decoration:none; }
  .vault-crumbs a:hover { text-decoration:underline; }
  .vault-crumbs .vc-sep { color:#55677a; }
  .vault-crumbs .vc-cur { color:#e7edf3; font-weight:600; }
  .vault-item.vault-folder { background:#1a2734; }
  .vault-item.vault-folder .vault-item-name { color:#ffd28a; font-weight:600; }
  .vault-ficon { width:26px; text-align:center; font-size:18px; }
  /* 多选 / 批量删除 */
  .vault-sel-bar { display:flex; align-items:center; gap:12px; margin-left:auto; }
  .vault-checkall { display:flex; align-items:center; gap:6px; font-size:13px; color:#cfe0ee; cursor:pointer; }
  .vault-bulk-btn { background:#e8720c; color:#fff; border:none; padding:8px 16px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600; }
  .vault-bulk-btn:disabled { background:#7a8a99; cursor:not-allowed; opacity:.7; }
  .vault-bulk-btn:hover:not(:disabled) { background:#c75f00; }
  .vault-pick { display:flex; align-items:center; padding:0 12px 0 4px; }
  .vault-pick input { width:18px; height:18px; cursor:pointer; accent-color:#e8720c; }
  /* 自定义橙色确认弹窗 */
  .vault-confirm { position:fixed; inset:0; z-index:9700; background:rgba(10,18,28,.78); display:flex; align-items:center; justify-content:center; }
  .vault-confirm-box { background:#fff; border-radius:14px; padding:24px 26px; width:380px; max-width:92vw; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .vault-confirm-title { font-size:17px; font-weight:700; color:#22303f; margin-bottom:10px; }
  .vault-confirm-msg { font-size:14px; color:#4a5566; line-height:1.6; margin-bottom:20px; white-space:pre-wrap; word-break:break-all; }
  .vault-confirm-actions { display:flex; justify-content:flex-end; gap:10px; }
  .vault-cf-cancel { background:#eef1f5; color:#22303f; border:1px solid #dde3ea; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:14px; }
  .vault-cf-ok { background:#e8720c; color:#fff; border:none; padding:9px 22px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
  .vault-cf-ok:hover { background:#c75f00; }
  .vault-cf-cancel:hover { background:#dfe6ee; }
  .vault-overlay.vault-drag { outline:3px dashed #e8720c; outline-offset:-10px; background:#13202e; }
  .vault-overlay.vault-drag::after {
    content: attr(data-drop-hint); position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(232,114,12,.92); color:#fff; padding:14px 26px; border-radius:12px; font-size:16px; font-weight:600;
    pointer-events:none; z-index:1;
  }
  /* 上传进度面板（右下角） */
  .vault-upanel { position:fixed; right:18px; bottom:18px; width:340px; max-width:92vw; z-index:9600;
    background:#16202c; border:1px solid #2c3d4f; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden; }
  .vault-upanel-head { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#1a2734; font-size:13px; color:#e7edf3; cursor:pointer; user-select:none; }
  .vault-upanel-head .vu-arrow { margin-left:auto; color:#7a8a99; font-size:11px; }
  .vault-upanel-body { max-height:260px; overflow:auto; padding:6px 10px 10px; }
  .vault-upanel.collapsed .vault-upanel-body { display:none; }
  .vu-row { padding:7px 6px 4px; }
  .vu-name { font-size:12px; color:#cfe0ee; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:5px; }
  .vu-bar { height:6px; background:#0d1520; border-radius:4px; overflow:hidden; }
  .vu-fill { height:100%; width:0; background:linear-gradient(90deg,#e8720c,#f7a44c); border-radius:4px; transition:width .15s; }
  .vu-fill.done { background:#2ecc71; }
  .vu-fill.fail { background:#e74c3c; }
  .vu-meta { display:flex; justify-content:space-between; font-size:11px; color:#7a8a99; margin-top:3px; }
  /* Word/Excel 预览容器 */
  .vault-doc-wrap { background:#fff; color:#222; max-width:860px; margin:0 auto; padding:28px 30px; border-radius:8px; min-height:60%; }
  .vault-doc-wrap table { border-collapse:collapse; font-size:12px; }
  .vault-doc-wrap td, .vault-doc-wrap th { border:1px solid #c9d2dc; padding:4px 8px; white-space:nowrap; }
  .vault-doc-wrap h1, .vault-doc-wrap h2, .vault-doc-wrap h3 { margin:.6em 0 .3em; }
  /* Word：按文档自身页面设置（A4 + 页边距）1:1 渲染，再整体等比缩放适配屏幕 */
  .ex-page-box { margin:0 auto; position:relative; }
  .ex-page-info { font-size:11px; color:#9fb0bd; text-align:center; margin:0 0 8px; }
  .ex-page-box .vault-doc-wrap.ex-doc { position:absolute; top:0; left:0; transform-origin:0 0; margin:0; }
  .vault-doc-wrap.ex-doc { width:210mm; min-height:297mm; padding:25.4mm;
    background:#fff; color:#222; box-sizing:border-box; border-radius:2px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    /* 未显式指定字号的段落按 Word 默认（Calibri 11pt）渲染，保证与 A4 页面比例一致 */
    font-family:Calibri, "Times New Roman", "PingFang SC", "Microsoft YaHei", sans-serif; font-size:11pt; }
  .vault-doc-wrap.ex-doc p { line-height:1.55; margin:.5em 0; color:#222; }
  .vault-doc-wrap.ex-doc ul, .vault-doc-wrap.ex-doc ol { margin:.5em 0; padding-left:1.6em; }
  .vault-doc-wrap.ex-doc li { margin:.25em 0; }
  .vault-doc-wrap.ex-doc h1, .vault-doc-wrap.ex-doc h2, .vault-doc-wrap.ex-doc h3,
  .vault-doc-wrap.ex-doc h4 { line-height:1.3; margin:.7em 0 .35em; }
  .vault-doc-wrap.ex-doc img { max-width:100%; height:auto; }
  .vault-doc-wrap.ex-doc table { border-collapse:collapse; max-width:100%; }
  .vault-doc-wrap.ex-doc td, .vault-doc-wrap.ex-doc th { border:1px solid #c9d2dc; padding:4px 6px; white-space:normal; word-break:break-word; }
  /* ===== Excel 渲染：表格视图（Excel 原貌：行列号 + 真实合并单元格）===== */
  .vault-doc-wrap .ex-grid-wrap { overflow:auto; -webkit-overflow-scrolling:touch; max-height:70vh; border:1px solid #c9d2dc; border-radius:6px; background:#fff; }
  .vault-doc-wrap table.ex-grid { border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12px; background:#fff; width:auto; min-width:100%; }
  .vault-doc-wrap .ex-grid th, .vault-doc-wrap .ex-grid td { border-right:1px solid #dfe4ea; border-bottom:1px solid #dfe4ea; padding:4px 6px; color:#22303f;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 列号行 / 行号列（仿 Excel 灰底坐标） */
  .vault-doc-wrap .ex-grid .ex-ax { background:#eef2f6; color:#8a97a5; font-weight:500; text-align:center; padding:2px 4px; height:22px; line-height:16px; }
  .vault-doc-wrap .ex-grid thead tr:first-child th { position:sticky; top:0; z-index:4; }
  .vault-doc-wrap .ex-grid .ex-corner { left:0; z-index:6; }
  .vault-doc-wrap .ex-grid .ex-rn { position:sticky; left:0; z-index:2; width:42px; }
  /* 真实表头行（数据首行识别）：粘在列号行下方 */
  .vault-doc-wrap .ex-grid thead tr.ex-hrow th { position:sticky; top:22px; z-index:3; background:#e8eef4; color:#22303f; font-weight:600;
    white-space:normal; word-break:break-word; text-align:center; vertical-align:middle; }
  .vault-doc-wrap .ex-grid thead tr.ex-hrow th.ex-rn { left:0; z-index:5; background:#eef2f6; }
  /* 大标题行（表头之上的跨列合并行，如报表总标题） */
  .vault-doc-wrap .ex-grid thead tr.ex-titlerow th { background:#f4f7fa; color:#22303f; font-weight:700;
    text-align:center; vertical-align:middle; white-space:normal; word-break:break-word; }
  .vault-doc-wrap .ex-grid thead tr.ex-titlerow th.ex-rn { left:0; z-index:5; background:#eef2f6; font-weight:500; }
  .vault-doc-wrap .ex-grid tbody tr:nth-child(odd) td { background:#fff; }
  .vault-doc-wrap .ex-grid tbody tr:nth-child(even) td { background:#f7f9fb; }
  .vault-doc-wrap .ex-grid tbody td.ex-m { text-align:center; vertical-align:middle; font-weight:600; background:#fbfcfe; }
  .vault-doc-wrap .ex-grid tbody tr:nth-child(even) td.ex-m { background:#f2f6fa; }
  .vault-doc-wrap .ex-num { text-align:right; font-variant-numeric:tabular-nums; }
  /* 单元格自带的背景色/字体色/边框用 inline style 写在 td/th 上，
     内联样式优先级天然高于上面的斑马纹与居中规则，无需额外覆盖。 */
  /* 长文本单元格自动换行（更接近 Excel 阅读体验） */
  .vault-doc-wrap .ex-grid td.ex-wrap { white-space:normal; word-break:break-word; line-height:1.4; }
  /* ===== Excel 渲染：卡片视图（每条记录一张卡，字段纵向，竖屏看全所有列）===== */
  .vault-doc-wrap .ex-cards { display:flex; flex-direction:column; gap:10px; }
  .vault-doc-wrap .ex-card { background:#fff; border:1px solid #dde3ea; border-radius:8px; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .vault-doc-wrap .ex-card-h { font-size:12px; font-weight:700; color:#e8720c; margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid #eef1f5; }
  .vault-doc-wrap .ex-card dl { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:0; font-size:12px; }
  .vault-doc-wrap .ex-card dt { color:#7a8a99; white-space:nowrap; }
  .vault-doc-wrap .ex-card dd { margin:0; color:#22303f; word-break:break-word; }
  /* ===== Excel 渲染：视图切换与提示 ===== */
  .vault-doc-wrap .ex-viewsw { display:flex; gap:4px; background:#eef1f5; padding:3px; border-radius:7px; }
  .vault-doc-wrap .ex-viewsw button { background:transparent; color:#5a6a7a; border:none; padding:4px 10px; border-radius:5px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .vault-doc-wrap .ex-viewsw button.on { background:#e8720c; color:#fff; }
  .vault-doc-wrap .ex-sheet { margin-bottom:18px; }
  .vault-doc-wrap .ex-sheet-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0 4px; }
  .vault-doc-wrap .ex-sheet-h h3 { margin:0; font-size:14px; color:#22303f; }
  .vault-doc-wrap .ex-meta { font-size:12px; color:#7a8a99; margin-right:2px; }
  .vault-doc-wrap .ex-note { font-size:12px; color:#a67c00; margin:2px 0 8px; }
  .vault-doc-wrap .ex-note.err { color:#c0392b; }
  /* 手机竖屏：文档宽度自适应，整页完整可见（自行决定缩放/横屏） */
  @media (max-width:640px){
    .vault-doc-wrap:not(.ex-doc) { width:100%; max-width:100%; padding:14px 10px; box-sizing:border-box; }
    .vault-doc-wrap:not(.ex-doc) table { width:100%; table-layout:fixed; }
    .vault-doc-wrap:not(.ex-doc) td, .vault-doc-wrap:not(.ex-doc) th { white-space:normal !important; word-break:break-all; padding:3px 5px; }
    .vault-doc-wrap img { max-width:100%; height:auto; }
    .vault-pdf-holder { max-width:100%; }
    /* 手机：Excel 表格容器自带横滑；卡片视图单列展示最清晰 */
    .vault-doc-wrap .ex-grid-wrap { max-height:60vh; }
    .vault-doc-wrap .ex-card dl { grid-template-columns:1fr; gap:2px; }
    .vault-doc-wrap .ex-card dt { font-weight:600; margin-top:3px; }
  }
  /* PDF.js 页面容器 */
  .vault-pdf-holder { max-width:900px; margin:0 auto; }
  .vault-pdf-holder canvas { width:100%; margin-bottom:10px; background:#fff; border-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.35); display:block; }
  /* 预览缩放：双指捏合 / Ctrl+滚轮 / 双击复位 */
  .vault-zoom-viewport { width:100%; height:100%; overflow:auto; -webkit-overflow-scrolling:touch; }
  .vault-zoom { transform-origin:0 0; will-change:transform; }
  /* 全屏按钮 */
  .vault-preview-head .vault-fs {
    margin-left:auto; background:#22303f; color:#cfe0ee; border:1px solid #34465a;
    width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:16px;
  }
  .vault-preview-head .vault-fs:hover { background:#2c3d4f; }
  /* 工具栏：返回 / 容量 / 视图切换 */
  .vault-back-btn { background:#3b7dd8; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; }
  .vault-back-btn:hover { background:#2f6bc0; }
  .vault-stat { font-size:12px; color:#9fb0bd; margin-left:6px; }
  .vault-view-switch { display:flex; gap:2px; background:#1a2734; padding:2px; border-radius:6px; }
  .vault-view-switch button { background:transparent; color:#9fb0bd; border:none; padding:6px 10px; border-radius:5px; cursor:pointer; font-size:18px; line-height:1; min-width:36px; min-height:32px; }
  .vault-view-switch button:hover { color:#e7edf3; }
  .vault-view-switch button.active { background:#e8720c; color:#fff; }
  /* 全部文件标签：在视图按钮右侧，自动同步当前目录 */
  .vault-cwd-tag { font-size:11px; color:#ffd28a; background:rgba(232,114,12,.12); border:1px solid rgba(232,114,12,.35); padding:3px 8px; border-radius:11px; line-height:1; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 网格视图 */
  .vault-list.vault-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:14px; padding:8px 22px 22px; }
  .vault-list.vault-grid .vault-item { flex-direction:column; align-items:flex-start; padding:14px; gap:8px; }
  .vault-list.vault-grid .vault-item-name { white-space:normal; word-break:break-all; font-size:13px; line-height:1.45; }
  .vault-list.vault-grid .vault-item-meta { min-width:0; }
  .vault-list.vault-grid .vault-item-actions { align-self:flex-end; }
  /* 缩略图视图（大图标 + 文件名，仿 Windows 资源管理器大图标） */
  .vault-list.vault-thumb { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:18px 12px; padding:14px 22px 22px; align-items:start; }
  .vault-list.vault-thumb .vault-item { flex-direction:column; align-items:center; text-align:center; padding:12px 6px; gap:8px; cursor:pointer; border:2px solid transparent; border-radius:6px; background:transparent; margin-bottom:0; }
  .vault-list.vault-thumb .vault-item:hover { background:rgba(255,255,255,.06); border-color:rgba(120,170,230,.4); }
  .vault-list.vault-thumb .vault-cb { display:none; }
  .vault-list.vault-thumb .vault-ficon { display:none; }
  .vault-list.vault-thumb .vault-item-name { white-space:normal; word-break:break-all; font-size:13px; line-height:1.35; max-height:2.7em; overflow:hidden; width:100%; }
  .vault-list.vault-thumb .vault-item-meta { display:none; }
  .vault-list.vault-thumb .vault-item-actions { display:none; }
  .vault-list.vault-thumb .vault-thumb-icon { width:96px; height:96px; border-radius:8px; background:#22303f; display:flex; align-items:center; justify-content:center; font-size:58px; }
  .vault-list.vault-thumb .vault-folder .vault-thumb-icon { background:transparent; }
  /* 预览进度 */
  .vault-progress { margin-left:10px; font-size:12px; color:#9fb0bd; min-width:140px; }
  /* 文件操作选择弹窗（预览/下载/取消） */
  .vault-choose { position:fixed; inset:0; z-index:9700; background:rgba(10,18,28,.78); display:flex; align-items:center; justify-content:center; }
  .vault-choose-box { background:#fff; border-radius:14px; padding:22px 24px; width:360px; max-width:92vw; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .vault-choose-title { font-size:15px; font-weight:700; color:#22303f; margin-bottom:4px; word-break:break-all; }
  .vault-choose-sub { font-size:12px; color:#7a8a99; margin-bottom:18px; }
  .vault-choose-actions { display:flex; justify-content:center; gap:12px; }
  .vault-choose-actions button { flex:1; padding:11px 0; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; border:none; }
  .vault-choose-prev { background:#e8f4fd; color:#1a6db5; border:1px solid #b5dcf7 !important; }
  .vault-choose-prev:hover { background:#d4ebfb; }
  .vault-choose-dl { background:#e8720c; color:#fff; }
  .vault-choose-dl:hover { background:#c75f00; }
  .vault-choose-close { background:#eef1f5; color:#4a5566; border:1px solid #dde3ea !important; }

  /* 手机两排布局：上排图标+完整文件名（水平），下排按钮 */
  @media (max-width:640px){
    .vault-item { flex-wrap:wrap; row-gap:8px; align-items:flex-start; }
    .vault-item-name {
      white-space:normal; word-break:break-all; overflow:visible; text-overflow:clip;
      font-size:14px; line-height:1.5; min-width:0;
    }
    .vault-item .vault-item-name  { flex:1 1 calc(100% - 46px); }
    .vault-folder .vault-item-name { flex:1 1 calc(100% - 76px); }
    .vault-item-meta { order:5; margin-right:auto; font-size:11px; align-self:center; }
    .vault-item-actions { order:6; margin-left:auto; }
  }
  /* 横屏（旋转后）：压缩留白 */
  @media (orientation:landscape) and (max-height:520px){
    .vault-head { padding:8px 14px; }
    .vault-toolbar { padding:8px 14px; gap:10px; }
    .vault-crumbs { padding:6px 14px 0; }
    .vault-item { padding:8px 12px; margin-bottom:6px; }
    .vault-list { padding:4px 14px 14px; }
  }
  /* ===== 屏幕方向：永久交互切换（按钮，随时点随时切）===== */
  .vault-orient-btn { background:#22303f; color:#cfe0ee; border:1px solid #34465a; padding:7px 12px;
    border-radius:8px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .vault-orient-btn:hover { background:#2c3d4f; }
  .vault-orient-btn.on { background:#e8720c; color:#fff; border-color:#e8720c; }
  .vault-preview-head .vault-orient-btn { margin-left:0; width:auto; height:34px; padding:0 11px; }
  /* CSS 兜底旋转：系统/浏览器不允许锁定时，直接把整页转 90° 显示（效果等同竖屏） */
  body.vault-rot-portrait { position:fixed; top:0; left:0; width:100vh; height:100vw; overflow:hidden;
    transform-origin:0 0; transform:translateX(100vw) rotate(90deg); }
  /* 兜底旋转时补上"窄屏"排版（媒体查询按真实视口判断，这里按类名补） */
  body.vault-rot-portrait .vault-head { padding:10px 14px; gap:10px; flex-wrap:wrap; }
  body.vault-rot-portrait .vault-toolbar { padding:10px 14px; gap:10px; }
  body.vault-rot-portrait .vault-crumbs { padding:6px 14px 0; }
  body.vault-rot-portrait .vault-list { padding:4px 14px 14px; }
  body.vault-rot-portrait .vault-item { flex-wrap:wrap; row-gap:8px; align-items:flex-start; }
  body.vault-rot-portrait .vault-item .vault-item-name { flex:1 1 calc(100% - 46px);
    white-space:normal; word-break:break-all; overflow:visible; text-overflow:clip; font-size:14px; line-height:1.5; min-width:0; }
  body.vault-rot-portrait .vault-folder .vault-item-name { flex:1 1 calc(100% - 76px); }
  body.vault-rot-portrait .vault-item-meta { order:5; margin-right:auto; font-size:11px; align-self:center; }
  body.vault-rot-portrait .vault-item-actions { order:6; margin-left:auto; }
  body.vault-rot-portrait .vault-doc-wrap:not(.ex-doc) { width:100%; max-width:100%; padding:14px 10px; }
  body.vault-rot-portrait .vault-doc-wrap:not(.ex-doc) table { width:100%; table-layout:fixed; }
  body.vault-rot-portrait .vault-doc-wrap:not(.ex-doc) td,
  body.vault-rot-portrait .vault-doc-wrap:not(.ex-doc) th { white-space:normal !important; word-break:break-all; padding:3px 5px; }
  /* 竖屏时 A4 文档整体缩放更明显，页面上下留白收紧 */
  .vault-doc-wrap.ex-doc { transform-origin:0 0; }
</style>
</head>

<!-- PIN 弹窗 -->
<div id="vaultPinModal" class="vault-pin-modal hidden">

    <div class="vault-pin-hint" id="vaultPinHint">请输入 4 位密码</div>
    <div class="vault-pin-cells">
      <input class="vault-pin-cell" type="password" inputmode="numeric" maxlength="1" readonly />
      <input class="vault-pin-cell" type="password" inputmode="numeric" maxlength="1" readonly />
      <input class="vault-pin-cell" type="password" inputmode="numeric" maxlength="1" readonly />
      <input class="vault-pin-cell" type="password" inputmode="numeric" maxlength="1" readonly />
    </div>
    <div class="vault-pin-keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>

      <button class="vault-pin-cancel" onclick="closeVaultPin()">取消</button>

      <div class="vault-ver" id="vaultVer">V2026.09.10.05</div>
      <!-- 版本号过时（被缓存）时显示，点击强制拉取最新代码 -->
      <button class="vault-ver-refresh hidden" id="vaultVerRefresh" onclick="vaultForceReload()">↻ 有新版，点此更新</button>
    </div>

</div>

<!-- 主面板 -->
<div id="vaultOverlay" class="vault-overlay hidden" data-drop-hint="松开即可上传到私密空间" data-vi18n-attr="data-drop-hint:common_drop_to_upload">

    <button class="vault-head-back" onclick="vaultHeadBack()" title="返回上一级（与系统返回键相同）" data-vi18n-attr="title:common_back"><span class="vault-btn-icon">⬅</span></button>
    <span class="vault-title"></span>
    <span class="vault-owner" title="tom · 专属">T</span>
    <span class="vault-ver-info" title="V2026.09.10.05">ⓘ<span class="vault-head-ver" id="vaultHeadVer">V2026.09.10.05</span></span>
    <button class="vault-orient-btn" id="vaultOrientBtn" onclick="vaultToggleOrient()" title="竖屏 / 横屏 切换" data-vi18n-attr="title:common_orient_title">🔄</button>
    <button class="vault-close" onclick="closeVault()" title="关闭" data-vi18n-attr="title:common_close">✕</button>
  </div>
  <div class="vault-toolbar">
    <button class="vault-upload-btn" onclick="document.getElementById('vaultFileInput').click()" title="上传文档（Word/Excel/PDF 等）" data-vi18n-attr="title:common_upload_file"><span class="vault-btn-icon">⬆</span> <span data-vi18n="common_upload_file">上传文件</span></button>
    <input id="vaultFileInput" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip,.rar,.7z,.html,.json,.xml,.apk" style="display:none" onchange="vaultDoUpload(this)" />
    <button class="vault-upload-btn vault-media-btn" onclick="document.getElementById('vaultMediaInput').click()" title="上传图片 / 视频" data-vi18n-attr="title:common_upload_media"><span class="vault-btn-icon">🖼</span> <span data-vi18n="common_upload_media">图片视频</span></button>
    <input id="vaultMediaInput" type="file" multiple accept="image/*,video/*" style="display:none" onchange="vaultDoUpload(this)" />
    <button class="vault-upload-btn vault-folder-btn" onclick="document.getElementById('vaultFolderInput').click()" title="上传文件夹" data-vi18n-attr="title:common_upload_folder"><span class="vault-btn-icon">📁</span> <span data-vi18n="common_upload_folder">文件夹</span></button>
    <input id="vaultFolderInput" type="file" multiple webkitdirectory directory style="display:none" onchange="vaultDoUpload(this)" />
    <button class="vault-back-btn hidden" id="vaultBackBtn" onclick="vaultGoUp()" title="返回上一级" data-vi18n-attr="title:common_back"><span class="vault-btn-icon">⬅</span></button>
    <span class="vault-count" id="vaultCount"></span>
    <span class="vault-stat" id="vaultStat"></span>
    <span class="vault-view-switch">
      <button data-view="list" class="active" onclick="vaultSetView('list',this)" title="列表" data-vi18n-attr="title:common_list">☰</button>

      <button class="vault-bulk-btn" id="vaultBulkDel" disabled onclick="vaultDelSelected()">删除选中 (0)</button>
    </span>
  </div>
  <div class="vault-crumbs hidden" id="vaultCrumbs"></div>
  <div class="vault-list" id="vaultList"></div>

</div>

<div id="vaultUpPanel" class="vault-upanel hidden">

  // 返回 true = 网页已消费返回动作，原生不再处理
  function vaultCanGoBackInternal(){

  var _lastBackState = null;

    try {
      if (window.AndroidBridge && window.AndroidBridge.setBackState) {
        window.AndroidBridge.setBackState(st);
      }
    } catch (e) {}
    // 通道B：自定义 scheme（shouldOverrideUrlLoading 同步拦截）
    // 仅在 APP 内使用：普通浏览器未注册该 scheme，导航会报
    // "scheme does not have a registered handler"，污染控制台。
    try {
      if (!window.AndroidBridge) return;

      var vo = document.getElementById('vaultOverlay');

  // ============================================================
  // 网页版返回键（与 APP 同规则）

  var _webBackLast = 0, _webBackBusy = false;
  function _webPushGuard(){
    try { history.pushState({ agipmGuard: 1 }, '', location.href); } catch (e) {}
  }
  window.__webHandleBack = function(){
    var now = Date.now();

      _webBackLast = 0;
      try { closeVault(); } catch (e) {}
      return true;
    }
    _webBackLast = now;
    var consumed = false;
    try { consumed = !!(window.__handleBack && window.__handleBack()); } catch (e) { consumed = false; }
    if (!consumed) { try { showToast('再按一次返回键退出私密空间'); } catch (e) {} }
    return consumed;
  };

    _webBackBusy = true;

  function vaultFolderSummary(folder){
    var bytes = 0, cnt = 0;

      if (f.name.indexOf(prefix) === 0){ bytes += (f.size||0); cnt++; }

    return { count: cnt, size: bytes, label: cnt + ' ' + (t.common_uploading_remaining ? '个文件' : '个文件') + ' · ' + fmtSize(bytes) };

  function fileIcon(name){
    if (/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name)) return '🖼';
    if (/\.(pdf)$/i.test(name)) return '📕';
    if (/\.(docx?)$/i.test(name)) return '📘';
    if (/\.(xlsx?)$/i.test(name)) return '📗';
    if (/\.(pptx?)$/i.test(name)) return '📙';
    if (/\.(txt|md|log|csv|json)$/i.test(name)) return '📄';
    if (/\.(mp4|mov|avi)$/i.test(name)) return '🎬';
    if (/\.(mp3|wav|flac)$/i.test(name)) return '🎵';

  // ===== 文件夹树渲染（与主系统 index.html 相同逻辑） =====
  // 行点击忽略区：勾选框 / label 包裹区 / 按钮 / 链接
  function rowTapIgnore(t){
    if (!t || !t.tagName) return true;
    if (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'A') return true;

  var vaultAll = [];

  var vaultView = [];

  function renderCrumbs(){
    var box = document.getElementById('vaultCrumbs');
    if (!box) return;
    box.innerHTML = '';
    var mk = function(label, dir, isCur){
      var a = document.createElement(isCur ? 'span' : 'a');
      a.className = isCur ? 'vc-cur' : '';
      a.textContent = label;
      if (!isCur) a.onclick = function(){ vaultCwd = dir; vaultChecked = {}; renderVault(); };
      box.appendChild(a);
      if (!isCur) {
        var sep = document.createElement('span');
        sep.className = 'vc-sep'; sep.textContent = '›';
        box.appendChild(sep);
      }
    };
    mk('🏠 全部文件', '', vaultCwd === '');
    // 同步顶部工具栏的目录徽章（点击 = 回到根）
    var tag = document.getElementById('vaultCwdTag');

      tag.textContent = vaultCwd ? ('📂 ' + vaultCwd.replace(/\/$/, '').split('/').pop()) : '🏠 全部文件';

      tag.style.cursor = 'pointer';
    }
    if (vaultCwd) {
      var segs = vaultCwd.replace(/\/$/, '').split('/');
      var acc = '';

  function renderVault(){

  function bindVaultDrag(){
    var zone=document.getElementById('vaultOverlay'); if(!zone) return;
    var counter=0;
    var showHint=function(on){ zone.classList.toggle('vault-drag', !!on); };
    zone.addEventListener('dragenter', function(e){ e.preventDefault(); counter++; showHint(true); });
    zone.addEventListener('dragover', function(e){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    zone.addEventListener('dragleave', function(e){ e.preventDefault(); counter--; if(counter<=0){ counter=0; showHint(false); } });
    zone.addEventListener('drop', function(e){
      e.preventDefault(); counter=0; showHint(false);
      var dt=e.dataTransfer;
      if(!dt) return;
      if (dt.items && dt.items.length && typeof DataTransferItem!=='undefined' && typeof DataTransferItem.prototype.webkitGetAsEntry==='function'){
        var entries=[];
        for(var i=0;i<dt.items.length;i++){
          var it=dt.items[i];
          if(it.kind==='file'){
            var entry=(typeof it.webkitGetAsEntry==='function')?it.webkitGetAsEntry():null;
            if(entry) entries.push(entry);
            else if(it.getAsFile){ var f=it.getAsFile(); if(f){ vaultUploadFiles([f]); return; } }
          }
        }
        if(entries.length){
          collectEntries(entries, [], function(files){ if(files && files.length) vaultUploadFiles(files); });
          return;
        }
      }
      if (dt.files && dt.files.length) vaultUploadFiles(dt.files);
    });
  }
  function collectEntries(entries, fileList, cb){
    var pending=entries.length;
    if(!pending){ cb(fileList); return; }
    function done(){ pending--; if(pending===0) cb(fileList); }
    function readDir(dirEntry){
      var reader=dirEntry.createReader();
      function step(){
        reader.readEntries(function(batch){
          if(!batch.length){ done(); return; }
          collectEntries(batch, fileList, function(){ step(); });
        }, function(){ done(); });
      }
      step();
    }
    function readFile(fileEntry){
      fileEntry.file(function(f){
        try{
          var rel=(fileEntry.fullPath||f.name).replace(/^\//,'');
          f=new File([f], rel, {type:f.type});
        }catch(err){}
        fileList.push(f);
        done();
      }, function(){ done(); });
    }
    for(var i=0;i<entries.length;i++){
      var ent=entries[i];
      if(ent.isFile) readFile(ent);
      else if(ent.isDirectory) readDir(ent);
      else done();
    }
  }

  var _libP = {}, _libSrc = {};
  function ensureLib(key, srcs){
    if (_libP[key]) return _libP[key];
    var i = 0;
    function tryNext(){
      if (i >= srcs.length) { _libP[key] = null; return Promise.reject(new Error('libs failed')); }
      var src = srcs[i++];
      return new Promise(function(res, rej){
        var s = document.createElement('script');
        s.src = src;
        s.onload = function(){ res(src); };
        s.onerror = function(){ s.remove(); rej(new Error('fail ' + src)); };
        document.head.appendChild(s);
      }).then(function(src2){ _libSrc[key] = src2; return src2; })
        .catch(function(){ return tryNext(); });
    }
    _libP[key] = tryNext();
    return _libP[key];
  }

  // ===== 双指捏合缩放 / 单指平移 / 双击复位 / Ctrl+滚轮（电脑）=====
  function bindPinchZoom(vp){
    if (vp.__pinchBound) return; vp.__pinchBound = true;
    var scale = 1, tx = 0, ty = 0;
    var st = { d: 0, s: 1 }, pan = null;
    var wrap = vp.querySelector('.vault-zoom');
    function dist(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.hypot(dx, dy); }
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
    function apply(){ wrap.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
    function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
    vp.addEventListener('touchstart', function(e){
      if (e.touches.length === 2) {
        st.d = dist(e.touches); st.s = scale; pan = null;
        e.preventDefault();
      } else if (e.touches.length === 1 && scale > 1) {
        pan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: false });
    vp.addEventListener('touchmove', function(e){
      if (e.touches.length === 2) {
        var ns = clamp(st.s * dist(e.touches) / st.d, 0.5, 5);
        var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        var r = vp.getBoundingClientRect();
        var ax = mx - r.left, ay = my - r.top;
        tx = ax - (ax - tx) * (ns / scale);
        ty = ay - (ay - ty) * (ns / scale);
        scale = ns; apply(); e.preventDefault();
      } else if (e.touches.length === 1 && pan && scale > 1) {
        tx += e.touches[0].clientX - pan.x;
        ty += e.touches[0].clientY - pan.y;
        pan = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        apply(); e.preventDefault();
      }
    }, { passive: false });
    vp.addEventListener('touchend', function(e){
      if (e.touches.length < 2 && scale <= 1.02) reset();
      if (e.touches.length < 2) pan = null;
    });
    vp.addEventListener('dblclick', reset);
    vp.addEventListener('wheel', function(e){
      if (!e.ctrlKey) return;
      e.preventDefault();
      var ns = clamp(scale * (e.deltaY < 0 ? 1.12 : 0.89), 0.5, 5);
      var r = vp.getBoundingClientRect();
      var ax = e.clientX - r.left, ay = e.clientY - r.top;
      tx = ax - (ax - tx) * (ns / scale);
      ty = ay - (ay - ty) * (ns / scale);
      scale = ns; apply();
    }, { passive: false });
  }

  // ============================================================
  // Word：按 docx 自身页面设置（纸张 + 页边距）1:1 渲染成 A4 页面，再整体等比缩放适配屏幕
  //   直接从 zip 里取出 word/document.xml，读 <w:pgSz> / <w:pgMar>（单位 twips，1 英寸 = 1440 twips）
  //   读不到（老浏览器无 DecompressionStream / 加密文档）时退回 A4 + 25.4mm 默认页边距
  // ============================================================
  function round1(v){ return (Math.round(Number(v) * 10) / 10); }
  function docxTwipMm(v){ return (parseInt(v, 10) / 1440) * 25.4; }
  function docxParseSect(xml){
    var m = {};
    var sec = xml.match(/<w:sectPr\b[\s\S]*?<\/w:sectPr>/);
    var s = sec ? sec[0] : '';
    var ps = s.match(/<w:pgSz[^>]*>/);
    if (ps){
      var w = /w:w="(-?\d+)"/.exec(ps[0]), h = /w:h="(-?\d+)"/.exec(ps[0]);
      if (w) m.pageWmm = docxTwipMm(w[1]);
      if (h) m.pageHmm = docxTwipMm(h[1]);
      // 横向纸张：pgSz 里宽高是"旋转前"的值，需要互换
      if (/w:orient="landscape"/.test(ps[0]) && m.pageWmm && m.pageHmm){
        var tmp = m.pageWmm; m.pageWmm = m.pageHmm; m.pageHmm = tmp;
      }
    }
    var pm = s.match(/<w:pgMar[^>]*>/);
    if (pm){
      var keys = ['top', 'right', 'bottom', 'left'];
      for (var i = 0; i < keys.length; i++){
        var r = new RegExp('w:' + keys[i] + '="(-?\\d+)"').exec(pm[0]);
        if (r) m[keys[i] + 'mm'] = docxTwipMm(r[1]);
      }
    }
    return (m.pageWmm || m.pageHmm || m.topmm != null) ? m : null;
  }
  function docxPageMeta(buf){
    return new Promise(function(resolve){
      try {
        var u8 = new Uint8Array(buf), i, eocd = -1;
        for (i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
          if (u8[i] === 0x50 && u8[i+1] === 0x4b && u8[i+2] === 0x05 && u8[i+3] === 0x06){ eocd = i; break; }
        }
        if (eocd < 0) return resolve(null);
        var cnt = u8[eocd+10] | (u8[eocd+11] << 8);
        var p = (u8[eocd+16] | (u8[eocd+17] << 8) | (u8[eocd+18] << 16) | (u8[eocd+19] << 24)) >>> 0;
        for (var n = 0; n < cnt; n++){
          if (u8[p] !== 0x50 || u8[p+1] !== 0x4b) break;
          var method = u8[p+10] | (u8[p+11] << 8);
          var nameLen = u8[p+28] | (u8[p+29] << 8);
          var extraLen = u8[p+30] | (u8[p+31] << 8);
          var cmtLen = u8[p+32] | (u8[p+33] << 8);
          var lho = (u8[p+42] | (u8[p+43] << 8) | (u8[p+44] << 16) | (u8[p+45] << 24)) >>> 0;
          var nm = '';
          for (var j = 0; j < nameLen; j++) nm += String.fromCharCode(u8[p+46+j]);
          if (nm === 'word/document.xml'){
            var lNameLen = u8[lho+26] | (u8[lho+27] << 8);
            var lExtraLen = u8[lho+28] | (u8[lho+29] << 8);
            var off = lho + 30 + lNameLen + lExtraLen;
            var csize = (u8[lho+18] | (u8[lho+19] << 8) | (u8[lho+20] << 16) | (u8[lho+21] << 24)) >>> 0;
            var raw = u8.subarray(off, off + csize);
            if (method === 0){
              return resolve(docxParseSect(new TextDecoder('utf-8').decode(raw)));
            }
            if (typeof DecompressionStream === 'undefined') return resolve(null);
            var stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return new Response(stream).text().then(
              function(xml){ resolve(docxParseSect(xml)); },
              function(){ resolve(null); }
            );
          }
          p += 46 + nameLen + extraLen + cmtLen;
        }
        resolve(null);
      } catch(e){ resolve(null); }
    });
  }

        html += '<div class="ex-sheet"><h3>' + excelEsc(sn) + '</h3><p class="ex-note err">（此工作表无法解析：' + excelEsc(m.err) + '）</p></div>';
        return;
      }
      if (m.empty){
        html += '<div class="ex-sheet"><h3>' + excelEsc(sn) + '</h3><p class="ex-note">（空工作表）</p></div>';
        return;
      }
      // 默认表格视图（原貌优先）；仅列数很多（>14）且用户没手动选过时用卡片
      var view = preferView || (m.keep.length > 14 ? 'card' : 'grid');
      var dataRows = m.rMax - (m.hdrRow >= 0 ? (m.hdrRow + 1) : 0);
      html += '<div class="ex-sheet">';
      html += '<div class="ex-sheet-h"><h3>' + excelEsc(sn) + '</h3>' +
        '<span class="ex-meta">' + dataRows + ' 行 × ' + m.keep.length + ' 列' +
        (m.merges.length ? ' · ' + m.merges.length + ' 处合并' : '') + '</span>' +
        '<div class="ex-viewsw">' +
          '<button data-v="grid" class="' + (view === 'grid' ? 'on' : '') + '" onclick="vaultExcelSetView(\'grid\')">📊 表格</button>' +
          '<button data-v="card" class="' + (view === 'card' ? 'on' : '') + '" onclick="vaultExcelSetView(\'card\')">🗂 卡片</button>' +
        '</div></div>';
      if (m.notes.length) html += '<p class="ex-note">' + m.notes.join('；') + '</p>';
      html += (view === 'card') ? excelCardHtml(m) : excelGridHtml(ws, m);
      html += '</div>';
    });
    return html || '(空文档)';
  }
  var _vaultCurPreviewIdx = -1;
  function vaultExcelSetView(v){
    try { localStorage.setItem('agipm_excel_view', v); } catch(e){}
    excelViewPref = v;
    if (_vaultCurPreviewIdx >= 0 && typeof vaultPreview === 'function') vaultPreview(_vaultCurPreviewIdx);
  }
  var _zoomTipShown = false;
  function vaultPreview(idx){
    var t = vaultT();
    var f = vaultView[idx]; if (!f) return;
    _vaultCurPreviewIdx = idx;   // 供 Excel 视图切换后重新渲染
    var name = f.name, lower = (name || '').toLowerCase();
    var prev = document.getElementById('vaultPreview');
    var body = document.getElementById('vaultPreviewBody');
    document.getElementById('vaultPreviewName').textContent = name;
    body.innerHTML = '<div class="vault-zoom-viewport"><div class="vault-zoom"><div class="vault-loading">' + (t.common_loading || '加载中…') + '</div></div></div>';
    var zoom = body.querySelector('.vault-zoom');
    bindPinchZoom(body.querySelector('.vault-zoom-viewport'));
    if (!_zoomTipShown) {
      _zoomTipShown = true;
      showToast('提示：右上 ⛶ 全屏 · 双指缩放 · 双击复位');
    }
    prev.classList.remove('hidden');
    var url = vaultPrevUrl(name);
    function fb(msg){ vaultFallback(zoom, name, msg); }
    if (/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(lower)) {
      zoom.innerHTML = '<div style="text-align:center"><img src="'+url+'" style="max-width:96%;max-height:96%" /></div>';
    } else if (/\.(txt|log|md|csv|json)$/i.test(lower)) {
      zoom.innerHTML = '<iframe src="'+url+'" style="width:100%;height:100%;border:0;background:#fff"></iframe>';
    } else if (/\.pdf$/i.test(lower)) {
      vaultRenderPdf(zoom, name, url);
    } else if (/\.docx$/i.test(lower)) {
      ensureLib('mammoth', ['/vendor/mammoth.browser.min.js',
                            'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js'])
        .then(function(){ return fetch(url).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }); })
        .then(function(buf){
          return docxPageMeta(buf).then(function(pm){
            return mammoth.convertToHtml({ arrayBuffer: buf }).then(function(res){
              return { html: res.value, pm: pm };
            });
          });
        })
        .then(function(out){
          var pm = out.pm || {};
          var wrap = document.createElement('div');
          wrap.className = 'ex-page-box';
          var info = document.createElement('div');
          info.className = 'ex-page-info';
          var pw = pm.pageWmm || 210, ph = pm.pageHmm || 297;
          var mg = [pm.topmm, pm.rightmm, pm.bottommm, pm.leftmm];
          var mgTxt = (mg[0] != null) ? (round1(pm.topmm) + '/' + round1(pm.rightmm) + '/' + round1(pm.bottommm) + '/' + round1(pm.leftmm) + 'mm') : '25.4mm（默认）';
          info.textContent = '📄 ' + round1(pw) + ' × ' + round1(ph) + ' mm · 页边距 ' + mgTxt +
                             (pm.pageWmm ? '（取自文档自身设置）' : '（文档未标注，按 A4 默认）');
          var page = document.createElement('div');
          page.className = 'vault-doc-wrap ex-doc';
          page.style.width = pw + 'mm';
          page.style.minHeight = ph + 'mm';
          page.style.padding = (pm.topmm != null ? pm.topmm : 25.4) + 'mm ' +
                               (pm.rightmm != null ? pm.rightmm : 25.4) + 'mm ' +
                               (pm.bottommm != null ? pm.bottommm : 25.4) + 'mm ' +
                               (pm.leftmm != null ? pm.leftmm : 25.4) + 'mm';
          page.innerHTML = out.html || '(空文档)';
          wrap.appendChild(info);
          wrap.appendChild(page);
          zoom.innerHTML = '';
          zoom.appendChild(wrap);
          vaultFitDocPage(wrap);
        })
        .catch(function(){ fb(t.common_word_preview_failed || 'Word 预览组件加载失败。'); });
    } else if (/\.(xlsx|xls)$/i.test(lower)) {
      ensureLib('xlsx', ['/vendor/xlsx.full.min.js',
                         'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'])
        .then(function(){ return fetch(url).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }); })
        .then(function(buf){
          var wb = XLSX.read(buf, { type: 'array', cellStyles: true });
          // 视觉样式（背景色/边框）需要从原始 XML 读，异步进行；失败不影响主体渲染
          var u8 = new Uint8Array(buf);
          return excelPrepareStyles(wb, u8).then(function(){
            zoom.innerHTML = '<div class="vault-doc-wrap">' + buildExcelHtml(wb, excelViewPref) + '</div>';
            try { window.__excelPostRender && window.__excelPostRender(zoom); } catch (e) {}
          });
        })
        .catch(function(e){
          var msg = String((e && e.message) || e || '');
          vaultFallback(body, name, msg.indexOf('HTTP') === 0
            ? ((t.common_file_download_failed || '文件下载失败（{msg}）。').replace('{msg}', msg))
            : (t.common_excel_parse_failed || '此 Excel 文件解析失败，可能是格式特殊或已损坏。') + '<br><span style="font-size:12px;color:#888">' + msg.replace(/</g, '&lt;') + '</span>');
        });
    } else {
      fb(t.common_preview_unsupported || '该格式暂不支持在线预览。');
    }
  }
  function closeVaultPreview(){
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    document.getElementById('vaultPreview').classList.add('hidden');
    document.getElementById('vaultPreviewBody').innerHTML='';
  }
  // ============================================================
  // 屏幕方向：永久交互切换
  //   入口：顶部/预览头 🔄 按钮（随时可点）+ 预览标题三击快捷方式
  //   三级实现：① APK 原生（AndroidBridge.setOrientation，最可靠）
  //            ② 标准 screen.orientation.lock（浏览器/PWA 全屏下可用）
  //            ③ CSS 整页旋转兜底（系统不允许锁定时，效果等同竖屏）
  //   选择写入 localStorage，下次进入自动恢复
  // ============================================================
  var VAULT_ORIENT_KEY = 'agipm_vault_orient';
  var _vaultOrient = (function(){ try { return localStorage.getItem(VAULT_ORIENT_KEY) || ''; } catch(e){ return ''; } })();
  function vaultCurPortrait(){
    var so = (window.screen && screen.orientation) || {};
    var t = so.type || '';
    if (t) return t.indexOf('portrait') >= 0;
    return (window.innerHeight || 0) > (window.innerWidth || 0);
  }
  function vaultIsPortrait(){
    return document.body.classList.contains('vault-rot-portrait') || vaultCurPortrait();
  }
  function vaultOrientRefreshBtn(){
    var t = vaultT();
    var txt = (vaultIsPortrait() ? '🔄 ' + (t.common_orient_landscape || '横屏') : '🔄 ' + (t.common_orient_portrait || '竖屏'));
    var ids = ['vaultOrientBtn', 'vaultOrientBtn2'];
    for (var i = 0; i < ids.length; i++){
      var b = document.getElementById(ids[i]);
      if (!b) continue;
      b.textContent = txt;
      try { b.classList.toggle('on', !!_vaultOrient); } catch(e){}
    }
  }
  function vaultToast(msg){ try { showToast(msg); } catch(e){} }
  function vaultCssRotate(mode){
    var need = (mode === 'portrait' && !vaultCurPortrait());
    document.body.classList.toggle('vault-rot-portrait', need);
    vaultOrientRefreshBtn();
    setTimeout(vaultFitAllDocPages, 60);
    var t = vaultT();
    vaultToast(mode === 'portrait'
      ? (need ? (t.common_orient_applied_portrait_fallback || '已竖屏显示（系统不允许锁定，采用页面旋转）') : (t.common_orient_applied_portrait || '已竖屏'))
      : (t.common_orient_applied_landscape || '已横屏'));
  }
  function vaultApplyOrient(mode, byUser){
    _vaultOrient = mode;
    try { localStorage.setItem(VAULT_ORIENT_KEY, mode); } catch(e){}
    // ① APK 原生
    try {
      if (window.AndroidBridge && typeof window.AndroidBridge.setOrientation === 'function') {
        window.AndroidBridge.setOrientation(mode);
        document.body.classList.remove('vault-rot-portrait');
        vaultOrientRefreshBtn();
        if (byUser) vaultToast(mode === 'portrait' ? '已切换竖屏' : '已切换横屏');
        return;
      }
    } catch(e){}
    // ② 标准 API
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock(mode).then(function(){
        document.body.classList.remove('vault-rot-portrait');
        vaultOrientRefreshBtn();
        if (byUser) vaultToast(mode === 'portrait' ? '已切换竖屏' : '已切换横屏');
      }).catch(function(){ vaultCssRotate(mode); });
      vaultOrientRefreshBtn();
      return;
    }
    // ③ CSS 兜底
    vaultCssRotate(mode);
  }
  function vaultToggleOrient(){
    vaultApplyOrient(vaultIsPortrait() ? 'landscape' : 'portrait', true);
  }
  window.vaultToggleOrient = vaultToggleOrient;
  // 三击预览标题 = 切屏快捷方式（避开按钮区，防止误触）
  var _triTapTimes = [];
  function _triTapRotate(){
    var now = Date.now();
    _triTapTimes = _triTapTimes.filter(function(t){ return now - t < 1200; });
    _triTapTimes.push(now);
    if (_triTapTimes.length >= 3) { _triTapTimes = []; vaultToggleOrient(); }
  }
  function vaultOrientInit(){
    var title = document.getElementById('vaultPreviewName');
    if (title) title.addEventListener('click', _triTapRotate);
    window.addEventListener('orientationchange', function(){
      document.body.classList.remove('vault-rot-portrait');
      vaultOrientRefreshBtn();
      setTimeout(vaultFitAllDocPages, 300);
    });
    window.addEventListener('resize', function(){ vaultOrientRefreshBtn(); vaultFitAllDocPages(); });
    if (_vaultOrient) setTimeout(function(){ vaultApplyOrient(_vaultOrient, false); }, 200);
    else vaultOrientRefreshBtn();
  }
  if (document.readyState !== 'loading') vaultOrientInit();
  else document.addEventListener('DOMContentLoaded', vaultOrientInit);
  // 离开页面时把方向还给主系统（主系统为「跟随传感器自由旋转」）
  window.addEventListener('pagehide', function(){
    try { if (window.AndroidBridge && window.AndroidBridge.setOrientation) window.AndroidBridge.setOrientation('sensor'); } catch(e){}
  });

  // ===== 单击文件 → 选择预览/下载 =====
  var _chooseName = '';
  function vaultChoose(name){
    _chooseName = name;
    document.getElementById('vaultChooseTitle').textContent = name.split('/').pop();
    document.getElementById('vaultChoose').classList.remove('hidden');
  }
  function vaultChooseClose(){
    document.getElementById('vaultChoose').classList.add('hidden');
    _chooseName = '';
  }
  // ===== 下载：XHR + 实时速度进度条（复用右下角面板） =====
  function vaultDownload(name){
    var t = vaultT();
    document.getElementById('vaultUpPanel').classList.remove('hidden');
    var body = document.getElementById('vaultUpBody');
    var row = document.createElement('div');
    row.className = 'vu-row';
    row.innerHTML = '<div class="vu-name"></div>' +
      '<div class="vu-bar"><div class="vu-fill"></div></div>' +
      '<div class="vu-meta"><span class="vu-pct">0%</span><span class="vu-st">' + (t.common_connecting || '连接中') + '</span></div>';
    row.querySelector('.vu-name').textContent = (t.crm_download || '下载') + ' · ' + name.split('/').pop();
    body.appendChild(row); body.scrollTop = body.scrollHeight;
    var fill = row.querySelector('.vu-fill'), pct = row.querySelector('.vu-pct'), st = row.querySelector('.vu-st');
    var xhr = new XMLHttpRequest();
    xhr.open('GET', vaultDlUrl(name));
    xhr.responseType = 'blob';
    var lastLoaded = 0, lastTime = Date.now();
    xhr.onprogress = function(e){
      if (!e.lengthComputable) { st.textContent = (t.common_received || '已接收 {size}').replace('{size}', fmtSize(e.loaded)); return; }
      var p = Math.round(e.loaded / e.total * 100);
      fill.style.width = p + '%'; pct.textContent = p + '%';
      var now = Date.now(), dt = (now - lastTime) / 1000;
      if (dt >= 0.3) {
        var speed = (e.loaded - lastLoaded) / dt;
        lastLoaded = e.loaded; lastTime = now;
        st.textContent = (t.common_downloading_speed || '{speed}/s · {loaded} / {total}').replace('{speed}', fmtSize(speed)).replace('{loaded}', fmtSize(e.loaded)).replace('{total}', fmtSize(e.total));
      }
    };
    xhr.onload = function(){
      if (xhr.status === 200 && xhr.response) {
        fill.style.width = '100%'; fill.classList.add('done');
        pct.textContent = '100%'; st.textContent = t.common_saved || '已保存';
        var a = document.createElement('a');
        a.href = URL.createObjectURL(xhr.response);
        a.download = name.split('/').pop();
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
        setTimeout(function(){ row.remove(); }, 2500);
      } else {
        fill.classList.add('fail');
        st.textContent = (t.common_download_failed || '下载失败 ({status})').replace('{status}', xhr.status);
      }
    };
    xhr.onerror = function(){ fill.classList.add('fail'); st.textContent = t.common_network_error || '网络错误'; };
    xhr.send();
  }
  // 选择弹窗事件（只绑一次）
  (function bindVaultChoose(){
    var modal = document.getElementById('vaultChoose');
    if (!modal || modal.__bound) return; modal.__bound = true;
    document.getElementById('vaultChoosePrev').addEventListener('click', function(){
      var n = _chooseName; vaultChooseClose();
      var idx = vaultView.findIndex(function(f){ return f.name === n; });
      var t = vaultT();
      if (idx >= 0) vaultPreview(idx); else showToast(t.common_file_not_in_view || '文件不在当前文件夹视图');
    });
    document.getElementById('vaultChooseDl').addEventListener('click', function(){
      var n = _chooseName; vaultChooseClose();
      if (n) vaultDownload(n);
    });
    document.getElementById('vaultChooseClose').addEventListener('click', vaultChooseClose);
    modal.addEventListener('click', function(e){ if (e.target === modal) vaultChooseClose(); });
  })();

  function vaultDel(name){
    var t = vaultT();
    vaultConfirm(t.common_delete_file_title || '删除文件', (t.common_delete_file_msg || '确认删除「{name}」？此操作不可撤销。').replace('{name}', name), function(){
      fetch(API_BASE + '/api/vault/delete',{method:'POST',headers:{'Content-Type':'application/json','X-Vault-Token':vaultToken},body:JSON.stringify({names:[name]})})
        .then(function(r){ return r.json(); })
        .then(function(d){ if(d.ok) { delete vaultChecked[name]; loadVaultFiles(); } else showToast(d.error || (t.common_toast_delete_failed || '删除失败')); })
        .catch(function(){ showToast(t.common_toast_delete_failed || '删除失败'); });
    });
  }
  // === 自定义橙色确认弹窗 ===
  var _vaultCfOk=null;
  function vaultConfirm(title,msg,onOk){
    var t = vaultT();
    document.getElementById('vaultConfirmTitle').textContent=title || (t.common_confirm || '确认操作');
    document.getElementById('vaultConfirmMsg').textContent=msg || (t.common_confirm || '是否继续？');
    _vaultCfOk=onOk||null;
    document.getElementById('vaultConfirm').classList.remove('hidden');
  }
  function _vaultCloseConfirm(){
    document.getElementById('vaultConfirm').classList.add('hidden');
    _vaultCfOk=null;
  }
  (function bindVaultConfirm(){
    var modal=document.getElementById('vaultConfirm');
    if (!modal || modal.__bound) return; modal.__bound=true;
    document.getElementById('vaultCfCancel').addEventListener('click',_vaultCloseConfirm);
    document.getElementById('vaultCfOk').addEventListener('click',function(){ var cb=_vaultCfOk; _vaultCloseConfirm(); if (cb) cb(); });
    modal.addEventListener('click',function(e){ if (e.target===modal) _vaultCloseConfirm(); });
    document.addEventListener('keydown',function(e){
      if (!modal.classList.contains('hidden') && e.key==='Escape') _vaultCloseConfirm();
    });
  })();

  // 绑定键盘 + 自动弹 PIN
  document.querySelectorAll('#vaultPinModal .vault-pin-keys button').forEach(function(b){
    b.addEventListener('click', function(){ pinPush(b.getAttribute('data-k')); });
  });
  // 物理键盘输入：数字 0-9 / Backspace / Delete / Esc / Enter
  (function(){
    var modal = document.getElementById('vaultPinModal');
    if (!modal) return;
    document.addEventListener('keydown', function(e){
      var open = !modal.classList.contains('hidden');
      if (!open) return;
      var k = e.key;
      if (/^[0-9]$/.test(k)) { e.preventDefault(); pinPush(k); return; }
      if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); pinPush('del'); return; }
      if (k === 'Escape') { e.preventDefault(); closeVaultPin(); return; }
      if (k === 'Enter') { e.preventDefault(); if (pinBuf.length === PIN_LEN) vaultTryUnlock(); return; }
    });
  })();
  // ===== 版本自检：确认加载的是否为最新版（PWA 缓存时提示更新）=====
  var VAULT_VER = 'V2026.09.10.05';
  function vaultForceReload(){
    // 带随机参数强制绕过一切缓存重新拉取
    try {
      if (window.caches && caches.keys) {
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); });
      }
    } catch(e){}
    location.replace(location.pathname + '?fresh=' + Date.now());
  }
  function vaultCheckVersion(){
    // 拉取线上 index.html 的版本号（主系统登录页的版本标签）作为基准
    fetch('/index.html?vc=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var m = t.match(/loginVer">([^<]+)</);
        var latest = m ? m[1] : null;
        if (!latest) return;
        var btn = document.getElementById('vaultVerRefresh');
        var headVer = document.getElementById('vaultHeadVer');
        if (latest !== VAULT_VER) {
          // 线上版本比本地新 → 提示更新
          if (btn) btn.classList.remove('hidden');
          if (headVer) headVer.textContent = VAULT_VER + '（有新版本 ' + latest + '）';
        } else {
          if (btn) btn.classList.add('hidden');
        }
      })
      .catch(function(){ /* 版本检查失败不影响使用 */ });
  }

// 独立入口：打开即弹出 PIN 输入
  window.addEventListener('load', function(){
    openVaultPin();
    try { vaultCheckVersion(); } catch(e){}
  });
</script>
