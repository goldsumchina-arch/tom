# AGI-PM 反代配置（放 /etc/nginx/sites-enabled/agi-pm.conf）
# 用法：
#   sudo apt-get install -y nginx
#   sudo ln -s /opt/agi-pm/node-backend/nginx-agi-pm.conf /etc/nginx/sites-enabled/agi-pm.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # HTTPS：sudo apt-get install -y certbot python3-certbot-nginx && sudo certbot --nginx -d 你的域名
server {
    listen 80;
    server_name agi-goldsum-crm.duckdns.org;

    client_max_body_size 50m;   # 允许大附件上传

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
